server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    # app shell: always revalidate so updates show up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # mnemonic tiles never change — cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri =404;
    }
}
